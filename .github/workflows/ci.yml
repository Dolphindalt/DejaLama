name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # The dev shell (rustc, cargo-nice-plug, the GL, X11, ALSA and JACK libraries) comes from
      # flake.lock; cache the store so that later runs skip building cargo-nice-plug.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The repository ships none of the editor's bitmaps: build.rs extracts them from the
      # original package, which the cache keeps between runs (key = the package's sha256).
      - uses: actions/cache@v6
        with:
          path: assets/Delay Lama.zip
          key: delay-lama-469ce87eb4ee80736919dd09aaa068d801de8fca4e57d6d2198c7b315ac09a40
      - name: Fetch the original package
        run: |
          test -f "assets/Delay Lama.zip" || nix develop --command curl --location --fail --silent --show-error \
            --output "assets/Delay Lama.zip" "https://archive.org/download/delay-lama-vst/Delay%20Lama.zip"
          echo "469ce87eb4ee80736919dd09aaa068d801de8fca4e57d6d2198c7b315ac09a40  assets/Delay Lama.zip" | sha256sum --check

      - name: Keep the original's files out of git
        run: test "$(git ls-files assets)" = assets/.gitkeep

      - run: nix develop --command cargo fmt --check
      - run: nix develop --command cargo clippy --all-targets -- -D warnings
      - run: nix develop --command cargo clippy --all-targets --features embed-assets -- -D warnings
      - run: nix develop --command cargo test
      - run: nix develop --command cargo test --features embed-assets
      - run: nix develop --command cargo check --features standalone
      - run: nix develop --command cargo nice-plug bundle deja_lama --release
